<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Calendario de Adviento</title>
  <script>
    const urls = [
      "https://drive.google.com/file/d/15TWaXR_g1xqtusRXHwi6zZi8eIi1m6FA/view?usp=drivesdk",
      "https://drive.google.com/file/d/1R3f2ZWox8_Iy69fU3PPXoDLQO4umMANA/view?usp=drivesdk",
      "https://drive.google.com/file/d/13lLHKh2RTSN8uQlFed8opMx5nVgSUdqC/view?usp=drivesdk",
      "https://drive.google.com/file/d/1rLoKsanJau6-hg_3X0XMzxvJzzVpuzWd/view?usp=drivesdk"
    ];

    // Lee la posición actual guardada en el navegador del teléfono
    let currentIndex = parseInt(localStorage.getItem('adviento_paso') || '0', 10);

    // Selecciona la foto que le toca ver
    const targetUrl = urls[currentIndex % urls.length];

    // Guarda el turno de la siguiente foto para la próxima visita
    localStorage.setItem('adviento_paso', currentIndex + 1);

    // Redirige inmediatamente
    window.location.replace(targetUrl);
  </script>
</head>
<body></body>
</html>
