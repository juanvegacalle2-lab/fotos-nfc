    ];

    // Carga las fotos pendientes de ver desde la memoria local
    let pendientes = JSON.parse(localStorage.getItem('fotos_pendientes') || '[]');

    // Si la lista está vacía o es la primera visita, carga las 40 fotos
    if (!Array.isArray(pendientes) || pendientes.length === 0) {
      pendientes = urls.map((_, index) => index);
    }

    // Elige una foto aleatoria dentro de las pendientes
    const posAleatoria = Math.floor(Math.random() * pendientes.length);
    const fotoSeleccionada = pendientes[posAleatoria];

    // Elimina la foto seleccionada para no repetirla
    pendientes.splice(posAleatoria, 1);

    // Guarda las pendientes restantes para la siguiente visita
    localStorage.setItem('fotos_pendientes', JSON.stringify(pendientes));

    // Redirige a la foto seleccionada
    window.location.replace(urls[fotoSeleccionada]);
