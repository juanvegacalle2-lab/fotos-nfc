<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fotos Aleatorias sin Repetición</title>
  <script>
    const urls = [
      "https://drive.google.com/file/d/15TWaXR_g1xqtusRXHwi6zZi8eIi1m6FA/view?usp=drivesdk",
      "https://drive.google.com/file/d/1R3f2ZWox8_Iy69fU3PPXoDLQO4umMANA/view?usp=drivesdk",
      "https://drive.google.com/file/d/13lLHKh2RTSN8uQlFed8opMx5nVgSUdqC/view?usp=drivesdk",
      "https://drive.google.com/file/d/1rLoKsanJau6-hg_3X0XMzxvJzzVpuzWd/view?usp=drivesdk"
    ];

    // Carga las fotos pendientes de ver desde la memoria local
    let pendientes = JSON.parse(localStorage.getItem('fotos_pendientes') || '[]');

    // Si la lista está vacía o es la primera visita, recarga las 4 fotos
    if (!Array.isArray(pendientes) || pendientes.length === 0) {
      pendientes = urls.map((_, index) => index);
    }

    // Elige un índice totalmente aleatorio dentro de las fotos pendientes
    const posAleatoria = Math.floor(Math.random() * pendientes.length);
    const fotoSeleccionada = pendientes[posAleatoria];

    // Elimina la foto seleccionada del grupo para no repetirla
    pendientes.splice(posAleatoria, 1);

    // Guarda las restantes para los siguientes escaneos
    localStorage.setItem('fotos_pendientes', JSON.stringify(pendientes));

    // Redirige a la foto obtenida
    window.location.replace(urls[fotoSeleccionada]);
  </script>
</head>
<body></body>
</html>
